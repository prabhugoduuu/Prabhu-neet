name: Build Android APK
on:
  push: workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make Android project and build
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          mkdir www && cp index.html www/index.html
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.neetmock.app",
            "appName": "NEET Mock",
            "webDir": "www",
            "server": { "url": "https://$OWNER.github.io/$REPO/", "androidScheme": "https" }
          }
          EOF
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEET-Mock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
