name: Build Android APK
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p /tmp/src /tmp/app/www
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/src/
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -o -q "$z" -d /tmp/src || true; fi
          done
          IDX=$(find /tmp/src -iname 'index*.html' -not -path '*/node_modules/*' -not -path '*/__MACOSX/*' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$IDX" ]; then
            echo "ERROR: index html dorakaledu"
            ls -R /tmp/src | head -50
            exit 1
          fi
          SRC=$(dirname "$IDX")
          cp -r "$SRC"/. /tmp/app/www/
          cp "$IDX" /tmp/app/www/index.html
          rm -f /tmp/app/www/*.zip
          ls -R /tmp/app/www | head -50
      - name: Build APK
        working-directory: /tmp/app
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.neetmock.app",
            "appName": "NEET Mock",
            "webDir": "www"
          }
          EOF
          npm init -y
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEET-Mock-APK
          path: /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk
