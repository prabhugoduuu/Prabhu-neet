name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p www
          for z in *.zip; do
            [ -f "$z" ] && unzip -o -q "$z" -d unzipped
          done
          if [ -d unzipped ]; then ROOT=unzipped; else ROOT=.; fi
          IDX=$(find "$ROOT" -name index.html -not -path '*/node_modules/*' -not -path '*/__MACOSX/*' -not -path './www/*' | head -n1)
          if [ -z "$IDX" ]; then echo "index.html dorakaledu"; exit 1; fi
          SRC=$(dirname "$IDX")
          rsync -a --exclude='.git' --exclude='.github' --exclude='*.zip' --exclude='node_modules' --exclude='www' --exclude='unzipped' --exclude='android' "$SRC"/ www/
          ls -R www | head -50
      - name: Make Android project and build
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.neetmock.app",
            "appName": "NEET Mock",
            "webDir": "www"
          }
          EOF
          npm init -y
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEET-Mock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
